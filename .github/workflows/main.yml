name: LMS Mini Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate project files
        run: |
          test -f index.html
          test -f css/style.css
          echo "LMS Mini Project files validated successfully."
